name: garaj
description: Garaj — aracının bakım, yakıt ve masraf defteri.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  go_router: ^18.1.1
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0
  uuid: ^4.6.0
  clock: ^1.1.3
  supabase_flutter: ^2.18.3
  flutter_secure_storage: ^11.2.0
  connectivity_plus: ^7.3.2
  drift: ^2.35.2
  drift_flutter: ^0.3.1
  path_provider: ^2.1.6
  path: ^1.9.1
  crypto: ^3.0.7
  image_picker: ^1.2.4
  image_cropper: ^13.0.0
  cunning_document_scanner: ^3.0.4
  google_mlkit_text_recognition: ^0.17.1
  geolocator: ^14.0.1
  geocoding: ^5.0.0
  google_maps_flutter: ^2.19.0
  url_launcher: ^6.3.3
  fl_chart: ^1.3.0
  flutter_local_notifications: ^22.3.2
  timezone: ^0.11.2
  flutter_timezone: ^5.1.1
  file_picker: ^13.1.0
  share_plus: ^13.3.1
  flutter_animate: ^4.5.2
  intl: ^0.20.3
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.17.1
  freezed: ^4.0.3
  json_serializable: ^6.15.2
  mocktail: ^1.0.5
  integration_test:
    sdk: flutter
  flutter_driver:
    sdk: flutter

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/map/
    - assets/fonts/Inter-OFL.txt
    - assets/fonts/SpaceGrotesk-OFL.txt
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf
    - family: SpaceGrotesk
      fonts:
        - asset: assets/fonts/SpaceGrotesk.ttf
